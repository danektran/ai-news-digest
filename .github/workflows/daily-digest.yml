name: Weekly AI Digest

on:
  schedule:
    - cron: '0 8 * 3-10 1'    # Monday 10:00 CEST (UTC+2, summer: Mar-Oct)
    - cron: '0 9 * 1-2,11-12 1' # Monday 10:00 CET  (UTC+1, winter: Nov-Feb)
  workflow_dispatch:        # allow manual runs from the GitHub UI

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py

      - name: Publish to GitHub Pages
        run: |
          echo "=== Checking docs/ contents ==="
          ls -la docs/ || echo "docs/ is empty or missing"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git status
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "digest: $(date +%Y-%m-%d)" && git push)
